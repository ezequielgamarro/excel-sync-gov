name: Secret Scanning (gitleaks)

# =============================================================================
# Secret scanning programado (RNF-13.d, spec §9.5). Escaneo COMPLETO del
# historial con `gitleaks detect` para detectar secretos introducidos en commits
# pasados, no solo en la PR. Es la defensa en profundidad del job `secret-scan`
# de `ci.yml`, que es el que BLOQUEA el merge en cada push/PR (evita ejecutar el
# mismo escaneo dos veces por PR y duplicar comentarios/SARIF).
#
# Usa `gitleaks/gitleaks-action` con la configuración custom `.gitleaks.toml`,
# que extiende las reglas por defecto, añade una allowlist para
# `specs/**`, `*.example.json` y `.env.example`, y define reglas propias
# (X-Key-Id, API Key de agente, base64 sk_/ak_/pk_).
#
# La acción termina con exit code 1 ante cualquier hallazgo (RNF-13.d).
# =============================================================================

on:
  workflow_dispatch:
  schedule:
    # Escaneo completo diario del historial (detecta secretos introducidos en
    # commits pasados, no solo en la PR).
    - cron: "17 4 * * *"

permissions:
  contents: read
  security-events: write   # subir reporte SARIF al Security tab
  pull-requests: write     # comentar hallazgos en la PR

jobs:
  secret-scan:
    name: gitleaks detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historial completo para escanear todos los commits

      - name: Run gitleaks (detect)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configuración custom: extiende reglas por defecto + allowlist de
          # docs/ejemplos + reglas propias. Por defecto la acción ejecuta
          # `gitleaks detect`.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Versión alineada con T5 (.pre-commit-config.yaml: gitleaks v8.24.2),
          # probada con este `.gitleaks.toml` (reglas custom + allowlist).
          GITLEAKS_VERSION: "8.24.2"
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Necesaria SOLO si el repositorio pertenece a una organización.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
