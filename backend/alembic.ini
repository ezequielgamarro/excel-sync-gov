# =============================================================================
# alembic.ini — Configuración de Alembic (backend)
# Tarea T7 (Fase F1) — marco de migraciones del sistema "Excel-to-Web".
#
# Zero Trust (spec §9.5, RNF-13): la URL de conexión NO vive aquí. `env.py`
# lee `DATABASE_URL` del entorno en tiempo de ejecución; las credenciales se
# inyectan desde el gestor de secretos y jamás se versionan ni se registran.
# =============================================================================

[alembic]
# Directorio de scripts de migración (relativo a este fichero).
script_location = %(here)s/alembic

# Se deja vacío a propósito: `env.py` la sobrescribe con `DATABASE_URL`.
sqlalchemy.url =

# Añade el directorio del backend a sys.path para que, cuando existan los
# modelos SQLAlchemy (F2+), `import app...` resuelva en modo autogenerate.
prepend_sys_path = %(here)s

# Codificación de los ficheros de revisión.
# version_path_separator = os  # por defecto

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
