openapi: 3.1.0
info:
  title: Google Sheets-to-Web — Dashboard de Monitoreo (API REST + WSS)
  version: 1.0.0
  description: >-
    Contrato OpenAPI (fuente única) de la API REST del sistema
    "Google Sheets-to-Web" (SPEC-001). Deriva de la sección §10 de
    `specs/001_dashboard_monitoreo/spec.md`.

    Convenciones:
    - Todos los endpoints de negocio viven bajo `/api/v1`. Los de salud/observabilidad
      (`/health/*`, `/metrics`, `/schema/messages/*`) y el WebSocket (`/ws/dashboard`)
      están en la raíz (§10.4).
    - Formato por defecto: `application/json; charset=utf-8`.
    - Cuerpo de error uniforme (§10): `{ "error": { "code", "message", "correlation_id" } }`.
    - Códigos HTTP comunes (§10.5): 200, 201, 202, 204 (logout, reservado), 400, 401,
      403, 404, 409, 410 (esquema de mensaje no soportado), 413, 422, 429, 500, 503.

    Seguridad:
    - Origen (Google Sheets / Apps Script): webhook firmado `HMAC-SHA256` con secreto
      compartido versionado por `key_id` (§9.1–§9.2). La firma viaja en
      `X-Webhook-Signature: sha256=<hex>` sobre la cadena canónica
      `"{webhook_id}|{key_id}|{nonce}|{timestamp}|{schema_version}|{sha256(cuerpo)}"`.
    - Operador: **auth nativa JWT** (usuario+contraseña → `POST /auth/login`),
      HS256/RS256 firmado por el backend, `aud=dashboard-api`, exp 15 min
      → `bearerAuth`. Sin IdP externo ni SSO.
    - WebSocket: ticket de un solo uso (TTL 60 s) emitido por
      `POST /api/v1/auth/ws-ticket`; nunca se viaja el JWT en la URL (§10.3).

    El contrato WebSocket (`/ws/dashboard`) se documenta en esta especificación
    mediante la extensión `x-websocket` (OpenAPI 3.1 no tipifica nativamente WS).
servers:
  - url: https://api.example.gov
    description: >-
      Origen de la API (producción: `api.<dominio-gob>`). El WSS se abre en
      `wss://api.<dominio-gob>/ws/dashboard`. `/metrics` solo es alcanzable desde
      la red interna (no expuesto en el edge).

tags:
  - name: Ingesta
    description: >-
      Ingesta del webhook firmado de Google Sheets / Apps Script y gestión del
      secreto compartido (provisión, rotación y estado).
  - name: Dashboard
    description: Lectura del operador (cold start, histórico, export, auditoría).
  - name: Auth
    description: Auth nativa JWT (login/refresh/logout) y ticket WSS de un solo uso.
  - name: Salud
    description: Liveness, readiness, métricas y esquema de mensajes.
  - name: Admin
    description: Gestión de usuarios y roles locales y del secreto del webhook.
  - name: WebSocket
    description: Canal de distribución en tiempo real.

paths:
  /api/v1/ingest/webhook:
    post:
      tags: [Ingesta]
      summary: Ingesta del webhook firmado de Google Sheets / Apps Script
      description: >-
        El trigger de Apps Script (`onEdit`/`onChange`) publica una instantánea
        absoluta del documento de Google Sheets como **JSON firmado**
        (`application/json`). No hay cifrado de aplicación adicional: la
        confidencialidad la aporta TLS 1.3 y la autenticación/integridad, la
        firma `HMAC-SHA256` (§9.1–§9.2).

        El backend verifica, **en este orden y antes de deserializar el cuerpo**
        (§2.2.1, RF-01.e/f): (1) presencia y formato de las cabeceras; (2)
        `webhook_id` existe, activo y no revocado; (3) `key_id` conocido y
        vigente; (4) **firma HMAC-SHA256 válida** (comparación en tiempo
        constante); (5) `X-Webhook-Timestamp` dentro de ±300 s; (6)
        `X-Webhook-Nonce` no visto en la ventana de replay (cache 600 s); (7)
        esquema y rangos del payload contra el JSON Schema y los catálogos fijos.

        Cadena canónica firmada (§9.2):
        `"{webhook_id}|{key_id}|{nonce}|{timestamp}|{schema_version}|{sha256(cuerpo)}"`,
        con `X-Webhook-Signature: sha256=<hex>`.

        Idempotencia: `event_id` UNIQUE. Reenvío con el mismo `event_id` → `200`
        con `duplicate: true` (sin re-aplicar ni redistribuir, RF-01.m / RNF-11.a).
      operationId: ingestWebhook
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/HeaderWebhookId'
        - $ref: '#/components/parameters/HeaderWebhookKeyId'
        - $ref: '#/components/parameters/HeaderWebhookNonce'
        - $ref: '#/components/parameters/HeaderWebhookTimestamp'
        - $ref: '#/components/parameters/HeaderWebhookVersion'
        - $ref: '#/components/parameters/HeaderWebhookSignature'
        - $ref: '#/components/parameters/HeaderCorrelationId'
      requestBody:
        required: true
        description: >-
          Cuerpo lógico firmado (§10.1). El backend verifica firma y frescura
          antes de deserializarlo. `payload` sigue la estructura de los KPIs,
          regional, turnos y ranking del JSON Schema de mensajes; `freshness` y
          `quality` los calcula el backend y no viajan desde el origen.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIngestRequest'
      responses:
        '202':
          description: Aceptado y redistribuido por WSS (RF-01.g, RNF-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestAccepted'
        '200':
          description: "Aceptado pero **duplicado** (`event_id` ya visto); `duplicate: true`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestAccepted'
        '400':
          description: Cuerpo malformado o versión no soportada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Firma HMAC ausente o inválida (no se deserializa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Webhook revocado o `key_id` no vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Anti-replay (nonce repetido o timestamp fuera de ventana).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload > 256 KB (plano) o > 64 KB (comprimido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Esquema/rangos inválidos (KPI negativo, unidad/turno no permitida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/webhook/secret/rotate:
    post:
      tags: [Ingesta, Admin]
      summary: Rotar el secreto del webhook (nueva `key_id`)
      description: >-
        El `platform-admin` genera/rota el secreto compartido del webhook de
        Google Sheets. Capacidad `platform.manage_webhook` (acción auditada). La
        rotación mantiene vigentes el secreto
        anterior y el nuevo durante **24 h (solape)** sin redesplegar el origen.
        El secreto se muestra **una sola vez** y se configura en `Script
        Properties` del script de Apps Script (§9.3–§9.5, §10.1).
      operationId: rotateWebhookSecret
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSecretRotateRequest'
      responses:
        '201':
          description: Secreto rotado; el material del secreto se devuelve una única vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecretRotateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `platform.manage_webhook`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Rotación ya en curso o `webhook_id` inexistente/revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/webhook:
    get:
      tags: [Ingesta, Admin]
      summary: Estado del webhook de Google Sheets
      description: >-
        Estado del webhook registrado (última recepción, `key_id` vigente,
        reintentos, modo degradado). Capacidad `platform.manage_webhook`.
        `platform-admin` no ve indicadores operativos (§2.2.3).
      operationId: getWebhookStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado del webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `platform.manage_webhook`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/dashboard/snapshot:
    get:
      tags: [Dashboard]
      summary: Cold start del dashboard
      description: >-
        Devuelve la última instantánea aceptada (sobre `indicators.snapshot`
        completo, coherente con `contracts/messages/1.0.0.schema.json`).
        Capacidad requerida: `dash.view.live`.
      operationId: getDashboardSnapshot
      security:
        - bearerAuth: []
      parameters:
        - name: tz
          in: query
          required: false
          description: Zona horaria IANA. Por defecto, la canónica `America/Argentina/Buenos_Aires`.
          schema:
            type: string
            default: America/Argentina/Buenos_Aires
        - name: room_id
          in: query
          required: false
          description: Identificador de la sala de operaciones (una instancia = una sala).
          schema:
            type: string
            example: sala-central
      responses:
        '200':
          description: Snapshot actual (sobre `indicators.snapshot`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `dash.view.live`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Existe un snapshot más nuevo disponible vía WSS (informativo; el cliente puede proceder).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/dashboard/consultas:
    get:
      tags: [Dashboard]
      summary: Agregación de la hoja CONSULTAS
      description: >-
        Agrupación real de la hoja «CONSULTAS» (20 columnas oficiales de la
        Jefatura) por Resultado, Causas Penales, Jefatura Regional y Turno,
        según los filtros globales (Turno, Unidad Regional, Rango). Alimenta los
        KPIs y los gráficos. Capacidad requerida: `dash.view.live`.
      operationId: getDashboardConsultas
      security:
        - bearerAuth: []
      parameters:
        - name: turno
          in: query
          required: false
          description: Turno operativo (filtro).
          schema:
            type: string
            enum: [MAÑANA, TARDE, NOCHE]
        - name: unidad
          in: query
          required: false
          description: Jefatura/Unidad regional (filtro).
          schema:
            type: string
            enum: [capital, sur, este, oeste, norte]
        - name: resultado
          in: query
          required: false
          description: Filtro por Resultado (subcadena).
          schema:
            type: string
        - name: causa
          in: query
          required: false
          description: Filtro por Causas Penales (subcadena).
          schema:
            type: string
        - name: rango
          in: query
          required: false
          description: Ventana temporal relativa.
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
      responses:
        '200':
          description: Agregación de CONSULTAS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultasAggregation'
        '400':
          description: Parámetros fuera del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `dash.view.live`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/dashboard/history:
    get:
      tags: [Dashboard]
      summary: Histórico de agregados
      description: >-
        Serie temporal de agregados. Capacidad requerida: `dash.view.history`.
        Rango máximo: 90 días para `supervisor`, 60 meses para `auditor`.
      operationId: getDashboardHistory
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio del rango (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Fin del rango (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          required: true
          description: Granularidad del agregado.
          schema:
            type: string
            enum: [hour, day]
        - name: unit
          in: query
          required: false
          description: Unidad regional opcional (filtro validado contra allowlist).
          schema:
            type: string
            enum: [capital, sur, este, oeste, norte]
        - name: timezone
          in: query
          required: false
          description: Zona horaria para el cálculo de buckets.
          schema:
            type: string
            default: America/Argentina/Buenos_Aires
      responses:
        '200':
          description: Serie temporal de agregados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          description: Rango inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `dash.view.history`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/dashboard/export.csv:
    get:
      tags: [Dashboard]
      summary: Exportación CSV de agregados
      description: >-
        Capacidad `dash.export.csv` **+ reautenticación reciente (≤ 5 min)**. Genera
        un CSV de agregados con cabecera de auditoría (`generado_por`, `event_id_base`,
        `ts`). La exportación se audita (AM-09).
      operationId: exportDashboardCsv
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV de agregados (con cabecera de auditoría).
          content:
            text/csv:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `dash.export.csv` o sin reautenticación reciente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/audit/events:
    get:
      tags: [Dashboard]
      summary: Eventos de auditoría
      description: >-
        Capacidad requerida: `audit.view`. Devuelve la lista de eventos de auditoría
        **sin PII** (§RNF-08.c).
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Inicio del rango (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Fin del rango (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: actor
          in: query
          required: false
          description: '`sub` del operador o `webhook_id` del origen.'
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: >-
            Acción (p. ej. `webhook.accepted`, `webhook.rejected`,
            `webhook.secret.rotated`, `user.created`, `role.assigned`).
          schema:
            type: string
        - name: event_id
          in: query
          required: false
          description: Filtra por el `event_id` de datos asociado.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de eventos de auditoría (sin PII).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `audit.view`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login nativo (usuario+contraseña)
      description: >-
        Autenticación **nativa** del operador (sin IdP externo ni SSO).
        Verifica usuario y contraseña contra el almacén local
        (`app.user_account`, hash Argon2id) con bloqueo por intentos y emite un
        **access JWT corto** (15 min) + **refresh rotativo** con detección de
        reutilización. Respuesta `Cache-Control: no-store`.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas; tokens emitidos.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales inválidas o cuenta no disponible (mensaje genérico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar refresh token
      description: >-
        Rota el **refresh token** y emite un nuevo par access+refresh. Reutilizar
        un refresh ya rotado revoca la cadena completa (reuse detection) y
        responde `401`. Respuesta `Cache-Control: no-store`.
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh rotado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh inválido, reutilizado o cadena revocada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: >-
        Revoca la cadena de refresh y marca la sesión para cerrar el WSS en ≤ 30 s.
        Responde con `Clear-Site-Data: "cache", "storage", "cookies"` (§2.2.5).
      operationId: authLogout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            Clear-Site-Data:
              schema:
                type: string
                example: '"cache", "storage", "cookies"'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/ws-ticket:
    post:
      tags: [Auth]
      summary: Emitir ticket WSS de un solo uso
      description: >-
        Emite un ticket de un solo uso para abrir el WSS (`wss://…/ws/dashboard?ticket=…`).
        El ticket encarna `sub`, capacidades y `room_id`; TTL de 60 s y un solo uso.
        Capacidad requerida: `dash.view.live` (JWT válido).
      operationId: createWsTicket
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ticket emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin capacidad `dash.view.live`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /health/live:
    get:
      tags: [Salud]
      summary: Liveness (proceso vivo)
      description: Público (edge). El proceso está vivo.
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Proceso vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags: [Salud]
      summary: Readiness (BD + Redis accesibles)
      description: Red interna. Incluye disponibilidad de PostgreSQL y Redis (RNF-14.g).
      operationId: healthReady
      security: []
      responses:
        '200':
          description: BD + Redis accesibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metrics:
    get:
      tags: [Salud]
      summary: Métricas Prometheus (solo red interna)
      description: >-
        **Solo red interna** (no público en el edge). Formato de exposición Prometheus.
      operationId: getMetrics
      x-internal: true
      security: []
      responses:
        '200':
          description: Métricas Prometheus.
          content:
            text/plain:
              schema:
                type: string

  /schema/messages/{version}:
    get:
      tags: [Salud]
      summary: JSON Schema del contrato de mensaje
      description: >-
        Sirve el JSON Schema del sobre `indicators.snapshot` (§7.8). Autenticado.
      operationId: getMessageSchema
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          description: Versión semver del esquema (p. ej. `1.0.0`).
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+$'
            example: 1.0.0
      responses:
        '200':
          description: JSON Schema (draft 2020-12) del sobre de mensaje.
          content:
            application/json:
              schema:
                $ref: './messages/1.0.0.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Versión de esquema no publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Versión mayor no soportada (el cliente debe actualizarse).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: Listar usuarios locales
      description: >-
        Lista los usuarios del almacén local (`app.user_account`). Capacidad
        `platform.manage_users`. Paginado y filtro por nombre. Rate limit
        estricto: 50 req/min por `sub`.
      operationId: adminListUsers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Filtro por nombre de usuario.
          schema:
            type: string
