<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04070F" />
    <title>Informe Operativo Comparativo · Policía de Tucumán</title>
    <meta
      name="description"
      content="Informe operativo comparativo en tiempo real para sala de operaciones (solo lectura)."
    />
    <!--
      CSP de respaldo para entornos que no aplican `_headers` (Cloudflare Pages).
      Política estricta sin `unsafe-inline` en script-src (T58, AM-06, AM-11).
      La fuente de verdad en producción es `public/_headers` (incluye
      `frame-ancestors 'none'`, que no es válido en meta).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
