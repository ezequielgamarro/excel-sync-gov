  /ws/dashboard:
    get:
      tags: [WebSocket]
      summary: WebSocket Seguro de distribución en tiempo real
      description: >-
        Canal de *push* (solo lectura para el cliente) por el que el backend
        redistribuye las instantáneas en tiempo real con fan-out por `room_id`.

        **Apertura:** el cliente obtiene primero un ticket de un solo uso con
        `POST /api/v1/auth/ws-ticket` y luego abre
        `wss://api.<dominio-gob>/ws/dashboard?ticket=tkt_…`. El ticket encarna `sub`,
        capacidades y `room_id`; TTL 60 s y un solo uso.

        **Mensajes servidor→cliente (JSON, texto):**
        - `hello`: `{ "type":"hello", "room_id", "schema_version", "server_ts", "last_seq", "heartbeat_interval_s" }`
        - `indicators.snapshot`: sobre completo (ver `SnapshotMessage`).
        - `heartbeat`: `{ "type":"heartbeat", "server_ts", "seq_hint" }` (cada 15 s).
        - `error`: `{ "type":"error", "code", "correlation_id" }`

        **Mensajes cliente→servidor:** sin datos de negocio. Solo
        `{ "type":"ping", "t":"<epoch_ms>" }` (keepalive) y, opcionalmente,
        `{ "type":"ack", "seq":N }` (métrica de entrega; ignorable).

        **Orden e idempotencia:** cada mensaje lleva `seq` monótono; el cliente aplica
        solo `seq > lastSeq`. Salto grande (`Δseq > 50`) → pedir cold start.

        **Reconexión:** backoff exponencial 1→30 s (jitter ±20 %); ante `4003`/`4401`
        → re-autenticar y pedir ticket nuevo; tras 60 s sin éxito → degradar a polling.

        **Códigos de cierre (§10.3):**
        - `1000` cierre normal → reconectar con backoff.
        - `1001` going away (mantenimiento) → reconectar con backoff.
        - `1008` violación de política (rate limit) → backoff largo (≥ 30 s).
        - `1009` mensaje demasiado grande → bug, no reintentar igual.
        - `4001` heartbeat/keepalive expirado → reconectar inmediato.
        - `4003` capacidad revocada / no autorizado → re-autenticar.
        - `4401` ticket inválido/expirado/ya usado → pedir ticket nuevo.
        - `4403` rol/capacidades cambiaron desde la apertura → re-autenticar y reabrir.
      operationId: wsDashboard
      x-websocket: true
      security: []
      responses:
        '101':
          description: >-
            Switching Protocols (upgrade a WebSocket). Los códigos de cierre del
            socket (1000, 1001, 1008, 1009, 4001, 4003, 4401, 4403) se documentan en
            la descripción de la operación (§10.3); no son códigos de respuesta HTTP.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de acceso **JWT nativo** emitido por el backend en
        `POST /auth/login`. Firma HS256/RS256 con `JWT_SIGNING_KEY`,
        `aud=dashboard-api`, exp ≤ 15 min. Sin IdP externo.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: >-
        Firma `HMAC-SHA256` del webhook de Google Sheets / Apps Script con secreto
        compartido versionado por `key_id` (§9.1–§9.2). Valor
        `sha256=<hex>` sobre la cadena canónica
        `"{webhook_id}|{key_id}|{nonce}|{timestamp}|{schema_version}|{sha256(cuerpo)}"`.
        Se compara en tiempo constante antes de deserializar el cuerpo.

  parameters:
    HeaderWebhookId:
      name: X-Webhook-Id
      in: header
      required: true
      description: Identificador del webhook de Google Sheets (un documento = un webhook).
      schema:
        type: string
        example: wh-sifcop-central
    HeaderWebhookKeyId:
      name: X-Webhook-Key-Id
      in: header
      required: true
      description: Versión (`key_id`) del secreto compartido usada para firmar.
      schema:
        type: string
        example: wk-2026-10
    HeaderWebhookNonce:
      name: X-Webhook-Nonce
      in: header
      required: true
      description: Nonce aleatorio de 128 bits para anti-replay (ventana 600 s).
      schema:
        type: string
        example: 7f3c9a2b1d8e4c6f5a0b3d9e8c7f6a1b
    HeaderWebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Marca de tiempo ISO-8601 UTC; desalineación máxima ±300 s.
      schema:
        type: string
        format: date-time
        example: '2026-10-03T14:22:05Z'
    HeaderWebhookVersion:
      name: X-Webhook-Version
      in: header
      required: true
      description: Versión del esquema del webhook (semver).
      schema:
        type: string
        example: 1.0.0
    HeaderWebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: 'Firma HMAC-SHA256: `sha256=<hex>`.'
      schema:
        type: string
        pattern: '^sha256=[0-9a-fA-F]{64}$'
    HeaderCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación extremo a extremo (RNF-07.b).
      schema:
        type: string
        example: tr-01JQ8Z
    PathUserId:
      name: userId
      in: path
      required: true
      description: Identificador del usuario local (`app.user_account.user_id`).
      schema:
        type: string

  responses:
    BadRequest:
      description: Petición malformada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token/firma ausente, inválido o expirado (no autenticado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Autenticado pero sin capacidad (fail-closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Esquema/rangos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit excedido.
      headers:
        Retry-After:
          description: Segundos hasta el siguiente intento permitido.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Backend no listo (arranque o mantenimiento).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      description: >-
        Cuerpo uniforme de error (§10). `code` es estable y programático
        (p. ej. `CAPACIDAD_DENEGADA`, `FIRMA_INVALIDA`, `ANTI_REPLAY`,
        `PAYLOAD_INVALID`, `WEBHOOK_REVOCADO`, `RATE_LIMITED`).
      properties:
        code:
          type: string
          description: Código de error estable.
        message:
          type: string
          description: Descripción legible (sin PII).
        correlation_id:
          type: string
          description: Identificador de correlación extremo a extremo.

    WebhookIngestRequest:
      description: >-
        Cuerpo lógico firmado del webhook (§10.1). El backend verifica firma y
        frescura **antes** de deserializarlo. **No** incluye `freshness`/`quality`
        (los calcula el backend al aceptar el evento).
      type: object
      additionalProperties: false
      required:
        [schema_version, event_id, doc_id, sheet_modified_at, data_date, tz, content_sha256, payload]
      properties:
        schema_version:
          type: string
          example: 1.0.0
        event_id:
          type: string
          format: uuid
          description: UUIDv7; clave de idempotencia (UNIQUE).
        doc_id:
          type: string
          example: sifcop-resumen
        sheet_modified_at:
          type: string
          format: date-time
          description: Marca de la última modificación del documento en Google Sheets.
        data_date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        tz:
          type: string
          example: America/Argentina/Buenos_Aires
        content_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: SHA-256 del contenido normalizado (RF-01.c).
        payload:
          type: object
          additionalProperties: false
          required: [kpis, regional, turnos, ranking]
          properties:
            kpis:
              $ref: './messages/1.0.0.schema.json#/properties/payload/properties/kpis'
            regional:
              $ref: './messages/1.0.0.schema.json#/properties/payload/properties/regional'
            turnos:
              $ref: './messages/1.0.0.schema.json#/properties/payload/properties/turnos'
            ranking:
              $ref: './messages/1.0.0.schema.json#/properties/payload/properties/ranking'

    WebhookIngestAccepted:
      type: object
      additionalProperties: false
      required: [status, duplicate, event_id, seq, received_at, correlation_id]
      properties:
        status:
          type: string
          enum: [accepted]
        duplicate:
          type: boolean
          description: '`true` cuando el `event_id` ya había sido procesado (idempotencia).'
        event_id:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 0
          description: Secuencia monótona asignada por `room_id`.
        received_at:
          type: string
          format: date-time
        correlation_id:
          type: string

    WebhookSecretRotateRequest:
      type: object
      additionalProperties: false
      description: >-
        Parámetros opcionales de la rotación. Si se omite `webhook_id` se rota el
        webhook registrado por defecto del documento declarado.
      properties:
        webhook_id:
          type: string
          example: wh-sifcop-central
        reason:
          type: string
          description: Motivo de la rotación (auditado).

    WebhookSecretRotateResponse:
      type: object
      additionalProperties: false
      required: [webhook_id, key_id, secret, overlap_until]
      properties:
        webhook_id:
          type: string
          example: wh-sifcop-central
        key_id:
          type: string
          example: wk-2026-10
        secret:
          type: string
          description: >-
            Material del secreto compartido; se muestra **una sola vez** y se
            configura en `Script Properties` de Apps Script. Nunca se versiona.
        overlap_until:
          type: string
          format: date-time
          description: Fin del solapamiento (24 h) en que el secreto anterior sigue vigente.

    WebhookStatusResponse:
      type: object
      additionalProperties: false
      required: [webhook_id, doc_id, active, current_key_id, degraded]
      properties:
        webhook_id:
          type: string
        doc_id:
          type: string
        active:
          type: boolean
          description: '`false` si el webhook está revocado.'
        current_key_id:
          type: string
        last_received_at:
          type: string
          format: date-time
          description: Marca de la última recepción aceptada.
        last_result:
          type: string
          enum: [accepted, rejected, none]
        retries_exhausted:
          type: integer
          minimum: 0
          description: Reintentos agotados reportados por el origen.
        degraded:
          type: boolean
          description: '`true` si superó el umbral sin contacto (RF-01.j).'

    SnapshotMessage:
      $ref: './messages/1.0.0.schema.json'

    HistoryResponse:
      type: object
      additionalProperties: false
      required: [series, meta]
      properties:
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ts]
            properties:
              ts:
                type: string
                format: date-time
              kpis:
                $ref: './messages/1.0.0.schema.json#/properties/payload/properties/kpis'
              regional:
                $ref: './messages/1.0.0.schema.json#/properties/payload/properties/regional'
        meta:
          type: object
          additionalProperties: false
          required: [bucket, count]
          properties:
            bucket:
              type: string
              enum: [hour, day]
            count:
              type: integer
              minimum: 0

    ConsultaGroup:
      type: object
      additionalProperties: false
      required: [key, label, value]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: integer
          minimum: 0

    ConsultasAggregation:
      type: object
      additionalProperties: false
      description: >-
        Agregación de la hoja «CONSULTAS» por Resultado, Causas Penales,
        Jefatura Regional y Turno, más los KPIs derivados.
      required: [meta, kpis, by_resultado, by_causas_penales, by_jefatura_regional, by_turno, series]
      properties:
        meta:
          type: object
          additionalProperties: false
          required: [rango, turno, unidad, resultado, causa, total]
          properties:
            rango: { type: string }
            turno: { type: string }
            unidad: { type: string }
            resultado: { type: string }
            causa: { type: string }
            total: { type: integer, minimum: 0 }
        kpis:
          type: object
          additionalProperties: false
          required: [total_consultas, personas_aprehendidas, vehiculos_secuestrados, armas_secuestradas]
          properties:
            total_consultas: { type: integer, minimum: 0 }
            personas_aprehendidas: { type: integer, minimum: 0 }
            vehiculos_secuestrados: { type: integer, minimum: 0 }
            armas_secuestradas: { type: integer, minimum: 0 }
        by_resultado:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaGroup'
        by_causas_penales:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaGroup'
        by_jefatura_regional:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaGroup'
        by_turno:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaGroup'
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ts, value]
            properties:
              ts:
                type: string
                format: date
              value:
                type: integer
                minimum: 0

    AuditEventsResponse:
      type: object
      additionalProperties: false
      required: [events, meta]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          type: object
          additionalProperties: false
          properties:
            count:
              type: integer
              minimum: 0

    AuditEvent:
      type: object
      additionalProperties: false
      description: >-
        Entrada de auditoría **sin PII** (§RNF-08.c). Campos mínimos según
        §RNF-08.b: `ts`, `actor`, `action`, `resource`, `result`, `ip`
        (seudonimizada), `user_agent`, `correlation_id`, `schema_version`.
      required: [ts, actor, action, resource, result, correlation_id, schema_version]
      properties:
        ts:
          type: string
          format: date-time
        actor:
          type: string
          description: '`sub` del operador o `webhook_id` del origen.'
        action:
          type: string
          description: >-
            p. ej. `webhook.accepted`, `webhook.rejected`,
            `webhook.secret.rotated`, `user.created`, `role.assigned`, `export.csv`.
        resource:
          type: string
        result:
          type: string
          enum: [success, denied, rejected]
        ip:
          type: string
          description: IP seudonimizada.
        user_agent:
          type: string
        correlation_id:
          type: string
        schema_version:
          type: string

    WsTicketResponse:
      type: object
      additionalProperties: false
      required: [ticket, expires_in]
      properties:
        ticket:
          type: string
          example: tkt_…
        expires_in:
          type: integer
          description: TTL del ticket en segundos (60).
          example: 60

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 512
          description: Contraseña en claro solo en tránsito (TLS); nunca se registra.

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token opaco; su reutilización revoca la cadena.

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          description: Refresh a revocar (opcional; revoca su cadena si se aporta).

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, sub, roles, capabilities]
      properties:
        access_token:
          type: string
          description: JWT de acceso firmado por el backend (≤ 15 min).
        refresh_token:
          type: string
          description: Refresh rotativo (cadena con detección de reutilización).
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Vida del access token en segundos (900).
          example: 900
        sub:
          type: string
          description: Identidad estable del operador (`app.user_account.sub`).
        roles:
          type: array
          items:
            type: string
            enum: [viewer, supervisor, auditor, platform-admin]
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password, roles]
      properties:
        username:
          type: string
        password:
          type: string
          description: Contraseña inicial; se almacena solo como hash Argon2id.
        roles:
          type: array
          items:
            type: string
            enum: [viewer, supervisor, auditor, platform-admin]

    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum: [viewer, supervisor, auditor, platform-admin]

    Capability:
      type: string
      description: Capacidad ortogonal comprobada por el backend (§2.2.3).
      enum:
        - dash.view.live
        - dash.view.history
        - dash.export.csv
        - audit.view
        - platform.manage_webhook
        - platform.manage_users
        - platform.rotate_secrets
        - platform.replay

    UserResponse:
      type: object
      additionalProperties: false
      required: [id, username, enabled, estado, roles]
      properties:
        id:
          type: string
        username:
          type: string
        enabled:
          type: boolean
        estado:
          type: string
          enum: [activo, deshabilitado]
        roles:
          type: array
          items:
            type: string
            enum: [viewer, supervisor, auditor, platform-admin]
        capabilities:
          type: array
          description: Capacidades derivadas del mapeo rol→capacidad.
          items:
            $ref: '#/components/schemas/Capability'
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserListResponse:
      type: object
      additionalProperties: false
      required: [users, meta]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        meta:
          type: object
          additionalProperties: false
          properties:
            count:
              type: integer

    RolesAssignRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [viewer, supervisor, auditor, platform-admin]

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        new_password:
          type: string
          description: Nueva contraseña; se almacena solo como hash Argon2id.

    ResetPasswordResponse:
      type: object
      additionalProperties: false
      required: [id, reset]
      properties:
        id:
          type: string
        reset:
          type: boolean

    RoleListResponse:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, capabilities]
            properties:
              name:
                type: string
                enum: [viewer, supervisor, auditor, platform-admin]
              capabilities:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'

    RoleCapabilitiesUpdateRequest:
      type: object
      additionalProperties: false
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'

    WssHello:
      type: object
      additionalProperties: false
      required: [type, room_id, schema_version, server_ts, last_seq, heartbeat_interval_s]
      properties:
        type:
          type: string
          const: hello
        room_id:
          type: string
        schema_version:
          type: string
        server_ts:
          type: string
          format: date-time
        last_seq:
          type: integer
        heartbeat_interval_s:
          type: integer
          example: 15

    WssHeartbeat:
      type: object
      additionalProperties: false
      required: [type, server_ts, seq_hint]
      properties:
        type:
          type: string
          const: heartbeat
        server_ts:
          type: string
          format: date-time
        seq_hint:
          type: integer

    WssError:
      type: object
      additionalProperties: false
      required: [type, code, correlation_id]
      properties:
        type:
          type: string
          const: error
        code:
          type: string
        correlation_id:
          type: string

    WssPing:
      description: Mensaje cliente→servidor (keepalive de aplicación).
      type: object
      additionalProperties: false
      required: [type, t]
      properties:
        type:
          type: string
          const: ping
        t:
          type: string
          description: epoch en milisegundos.

    WssAck:
      description: Mensaje cliente→servidor (métrica de entrega; ignorable).
      type: object
      additionalProperties: false
      required: [type, seq]
      properties:
        type:
          type: string
          const: ack
        seq:
          type: integer
